<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">My Life Dashboard</h1>
      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-pressed="false" aria-label="Switch to dark mode">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="dashboard">
    <section id="greeting" class="card greeting" aria-labelledby="greeting-heading">
      <h2 id="greeting-heading" class="greeting-text">Hello!</h2>
      <p class="greeting-time" id="current-time">--:--</p>
      <p class="greeting-date" id="current-date">Loading date…</p>
    </section>
    <section id="focus-timer" class="card focus-timer" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="section-title">Focus Timer</h2>
      <p class="timer-display" id="timer-display" aria-live="polite">25:00</p>
      <div class="timer-controls" role="group" aria-label="Timer controls">
        <button id="timer-start" class="btn btn-primary" type="button">Start</button>
        <button id="timer-stop" class="btn" type="button">Stop</button>
        <button id="timer-reset" class="btn" type="button">Reset</button>
      </div>
      <p class="timer-status" id="timer-status">Ready to focus</p>
    </section>
    <section id="todo-list" class="card todo-list" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="section-title">To-Do List</h2>
      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="visually-hidden">Add a new task</label>
        <input id="todo-input" class="todo-input" type="text"
               placeholder="Add a new task…" autocomplete="off" />
        <button id="todo-add" class="btn btn-primary" type="submit">Add</button>
      </form>
      <ul id="todo-items" class="todo-items" aria-live="polite">
      </ul>
      <p class="todo-empty" id="todo-empty">No tasks yet — add one above!</p>
    </section>
    <section id="quick-links" class="card quick-links" aria-labelledby="links-heading">
      <h2 id="links-heading" class="section-title">Quick Links</h2>
      <form id="link-form" class="link-form">
        <label for="link-name" class="visually-hidden">Link name</label>
        <input id="link-name" class="link-input" type="text"
               placeholder="Link name (e.g. Google)" autocomplete="off" required />
        <label for="link-url" class="visually-hidden">URL</label>
        <input id="link-url" class="link-input" type="text"
               placeholder="URL (e.g. google.com)" autocomplete="off" required />
        <button id="link-add" class="btn btn-primary" type="submit">Add Link</button>
      </form>
      <ul id="links-list" class="links-list">
      </ul>
      <p class="links-empty" id="links-empty">No quick links yet — add one above!</p>
    </section>

  </main>
  <script src="js/script.js"></script>
</body>
</html>
